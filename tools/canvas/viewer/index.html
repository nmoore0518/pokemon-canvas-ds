<title>Canvas Map Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: the map fills the window; a field-guide panel docks at the left, a readout at the bottom */
:root {
  --ink: #e9ecf2; --muted: #9aa3b5; --panel: rgba(20, 24, 34, 0.92); --panel-edge: #2c3446;
  --well: #11151e; --accent: #f2b33d; --warp: #4fd1e8; --sign: #f2d24f; --trigger: #ef7b4a; --sky: #0b0e14;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 14px/1.45 var(--font-ui); overflow: hidden; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view canvas:active { cursor: grabbing; }
.panel {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  width: min(320px, calc(100vw - 24px)); max-height: calc(100% - 120px); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 14px; display: grid; gap: 12px;
  backdrop-filter: blur(6px);
}
.panel.closed > :not(header) { display: none; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
label.k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
select, input[type=search] {
  width: 100%; box-sizing: border-box; background: var(--well); color: var(--ink); border: 1px solid var(--panel-edge);
  border-radius: 6px; padding: 7px 8px; font: 13px var(--font-ui);
}
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  background: var(--well); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px;
  font: 500 12px var(--font-ui); cursor: pointer;
}
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--accent); color: #1a1406; border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.keys { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.keys dt { font-family: var(--font-data); color: var(--ink); }
.keys dd { margin: 0; }
.readout {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 24px); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 8px 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: 13px var(--font-data); font-variant-numeric: tabular-nums;
}
.readout b { color: var(--accent); font-weight: 500; }
.readout .dim { color: var(--muted); }
#status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font: 13px var(--font-data); color: var(--muted); pointer-events: none; }
#picked { font-size: 12px; color: var(--muted); font-family: var(--font-data); white-space: pre-wrap; min-height: 1em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="view"></div>
<div id="status">Loading maps&hellip;</div>

<section class="panel" id="panel" aria-label="Map viewer controls">
  <header>
    <h1>Pok&eacute;mon Canvas <span>map viewer</span></h1>
    <button id="fold" aria-expanded="true" title="Hide this panel">Hide</button>
  </header>
  <div>
    <label class="k" for="find">Map</label>
    <input id="find" type="search" placeholder="Search maps (e.g. silph 5f)" autocomplete="off">
    <select id="maps" size="8" style="margin-top:6px"></select>
  </div>
  <div>
    <label class="k">Camera</label>
    <div class="row">
      <button id="cam-game" aria-pressed="true" title="As the game's camera looks: from the south, tilted down">Game view</button>
      <button id="cam-fly" aria-pressed="false" title="Free flight">Fly</button>
      <button id="cam-top" aria-pressed="false" title="Straight down">Top down</button>
    </div>
  </div>
  <div>
    <label class="k">Show</label>
    <div class="toggles">
      <label><input type="checkbox" id="t-people" checked> People</label>
      <label><input type="checkbox" id="t-grid"> Square grid</label>
      <label><input type="checkbox" id="t-warps"> <span class="sw" style="background:var(--warp)"></span>Warps</label>
      <label><input type="checkbox" id="t-signs"> <span class="sw" style="background:var(--sign)"></span>Signs</label>
      <label><input type="checkbox" id="t-trig"> <span class="sw" style="background:var(--trigger)"></span>Triggers</label>
    </div>
  </div>
  <div>
    <label class="k">Controls</label>
    <dl class="keys">
      <dt>drag</dt><dd>look around (fly), or pan (game, top down)</dd>
      <dt>W A S D</dt><dd>move</dd>
      <dt>Q / E</dt><dd>down / up</dd>
      <dt>Shift</dt><dd>move faster</dd>
      <dt>wheel</dt><dd>zoom (game, top down), speed (fly)</dd>
      <dt>click</dt><dd>pick a square: its place goes in the readout</dd>
    </dl>
  </div>
  <div id="picked" aria-live="polite"></div>
</section>

<div class="readout" id="readout">
  <span id="r-map">&mdash;</span>
  <span>square <b id="r-sq">&mdash;</b></span>
  <span class="dim" id="r-gba"></span>
  <button id="copy" title="Copy the picked square's place, to paste into the chat">Copy place</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const status = $('status');
  let LIST = [], current = null, picked = null;

  // ---------------------------------------------------------------- renderer, scene, cameras
  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  $('view').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e14);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 2000);
  const world = new THREE.Group(), marks = new THREE.Group(), people = new THREE.Group();
  scene.add(world, marks, people);
  let grid = null;
  const sel = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xf2b33d, transparent: true, opacity: 0.45, depthTest: false }));
  sel.rotation.x = -Math.PI / 2; sel.visible = false; sel.renderOrder = 10; scene.add(sel);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  // camera state: a target on the ground, and how we look at it
  const cam = { mode: 'game', target: new THREE.Vector3(), dist: 14, yaw: 0, pitch: 0.75, pos: new THREE.Vector3(), ground: 0 };
  function placeCamera() {
    if (cam.mode === 'fly') {
      camera.position.copy(cam.pos);
      const d = new THREE.Vector3(Math.sin(cam.yaw) * Math.cos(cam.pitch), -Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch));
      camera.lookAt(cam.pos.clone().add(d));
    } else {
      const p = cam.mode === 'top' ? 1.5607 : 0.72;      // (the game's field camera looks down about 41 degrees)
      camera.position.set(cam.target.x, cam.target.y + Math.sin(p) * cam.dist, cam.target.z + Math.cos(p) * cam.dist);
      camera.lookAt(cam.target);
    }
  }
  function setMode(m) {
    if (m === 'fly' && cam.mode !== 'fly') {
      cam.pos.copy(camera.position);
      const d = cam.target.clone().sub(camera.position).normalize();
      cam.pitch = Math.asin(-d.y); cam.yaw = Math.atan2(d.x, -d.z);
    } else if (m !== 'fly' && cam.mode === 'fly') {
      const d = new THREE.Vector3(Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
      cam.target.set(cam.pos.x + d.x * 6, cam.ground, cam.pos.z + d.z * 6);
    }
    cam.mode = m;
    for (const k of ['game', 'fly', 'top']) $('cam-' + k).setAttribute('aria-pressed', String(k === m));
    placeCamera();
  }
  for (const k of ['game', 'fly', 'top']) $('cam-' + k).addEventListener('click', () => setMode(k));

  // ---------------------------------------------------------------- input
  const keys = new Set();
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    keys.add(e.key.toLowerCase());
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());
  const el = renderer.domElement;
  let drag = null, moved = 0;
  el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; moved = 0; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', (e) => { if (drag && moved < 5) pick(e); drag = null; });
  el.addEventListener('pointermove', (e) => {
    hover(e);
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; moved += Math.abs(dx) + Math.abs(dy);
    if (cam.mode === 'fly') {
      cam.yaw += dx * 0.004; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.004));
    } else {
      const k = cam.dist / el.clientHeight * 1.1;
      cam.target.x -= dx * k; cam.target.z -= dy * k * (cam.mode === 'top' ? 1 : 1.4);
    }
    placeCamera();
  });
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (cam.mode === 'fly') flySpeed = Math.max(1, Math.min(80, flySpeed * (e.deltaY > 0 ? 0.85 : 1.18)));
    else { cam.dist = Math.max(3, Math.min(400, cam.dist * (e.deltaY > 0 ? 1.12 : 0.89))); placeCamera(); }
  }, { passive: false });
  let flySpeed = 8, last = performance.now();
  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const f = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
    const r = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
    const u = (keys.has('e') || keys.has(' ') ? 1 : 0) - (keys.has('q') ? 1 : 0);
    if (f || r || u) {
      const fast = keys.has('shift') ? 3 : 1;
      if (cam.mode === 'fly') {
        const s = flySpeed * fast * dt;
        const fw = new THREE.Vector3(Math.sin(cam.yaw) * Math.cos(cam.pitch), -Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch));
        const rt = new THREE.Vector3(Math.cos(cam.yaw), 0, Math.sin(cam.yaw));
        cam.pos.addScaledVector(fw, f * s).addScaledVector(rt, r * s); cam.pos.y += u * s;
      } else {
        const s = Math.max(4, cam.dist * 0.9) * fast * dt;
        cam.target.x += r * s; cam.target.z -= f * s; cam.target.y += u * s * 0.5;
      }
      placeCamera();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  // ---------------------------------------------------------------- picking: the square under the pointer
  const ray = new THREE.Raycaster();
  function ndc(e) { const b = el.getBoundingClientRect(); return new THREE.Vector2((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1); }
  function groundHit(e) {
    ray.setFromCamera(ndc(e), camera);
    const t = (cam.ground - ray.ray.origin.y) / ray.ray.direction.y;
    return t > 0 ? ray.ray.origin.clone().addScaledVector(ray.ray.direction, t) : null;
  }
  function hover(e) {
    const p = groundHit(e);
    if (p) showSquare(Math.floor(p.x), Math.floor(p.z), false);
  }
  function pick(e) {
    ray.setFromCamera(ndc(e), camera);
    const hits = ray.intersectObjects([...world.children, ...people.children], false);
    let p = hits.length ? hits[0].point : groundHit(e);
    if (!p) return;
    let who = '';
    const h = hits[0];
    if (h && h.object.userData.person) { const q = h.object.userData.person; p = new THREE.Vector3(q.x + 0.5, 0, q.z + 0.5); who = q; }
    const x = Math.floor(p.x + (hits.length && !who ? -1e-3 * Math.sign(h.face ? h.face.normal.x : 0) : 0));
    const z = Math.floor(p.z + (hits.length && !who ? -1e-3 * Math.sign(h.face ? h.face.normal.z : 0) : 0));
    picked = { x, z, who };
    sel.position.set(x + 0.5, (who ? cam.ground : p.y) + 0.02, z + 0.5); sel.visible = true;
    showSquare(x, z, true);
    $('picked').textContent = who ? `${who.sprite}  id ${who.id}\n${who.script}` : '';
  }
  function gbaAt(x, z) {
    if (!current || !current.gba) return '';
    for (const [d, v] of Object.entries(current.gba)) {
      if (x >= v[0] && z >= v[1] && x < v[0] + v[2] && z < v[1] + v[3]) return `${d.replace(/_Frlg$/, '')} ${x - v[0]}, ${z - v[1]}`;
    }
    return '';
  }
  function showSquare(x, z, keep) {
    if (picked && !keep) return;
    $('r-sq').textContent = `${x}, ${z}`;
    const g = gbaAt(x, z);
    $('r-gba').textContent = g ? `GBA ${g}` : '';
  }
  $('copy').addEventListener('click', async () => {
    if (!current) return;
    const s = picked || { x: '?', z: '?' };
    const g = gbaAt(s.x, s.z);
    const text = `${current.title} (${current.map || 'overworld'}), square ${s.x}, ${s.z}` + (g ? ` = GBA ${g}` : '') + (s.who ? `, ${s.who.sprite} (id ${s.who.id})` : '');
    try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied'; }
    catch (err) { $('picked').textContent = text; $('copy').textContent = 'Select the text above'; }
    setTimeout(() => { $('copy').textContent = 'Copy place'; }, 1500);
  });

  // ---------------------------------------------------------------- loading a map file
  async function loadBin(file) {
    const b64 = await (await fetch('m/' + file + '.txt')).text();
    const bin = atob(b64.trim()), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const buf = u8.buffer;
    const dv = new DataView(buf);
    const n = dv.getUint32(4, true);
    const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, n)));
    const base = 8 + n;
    const texs = await Promise.all(head.textures.map(async (t) => {
      const blob = new Blob([new Uint8Array(buf, base + t.at, t.len)], { type: 'image/png' });
      const img = await createImageBitmap(blob);
      return { img, w: t.w, h: t.h };
    }));
    return { head, buf, base, texs };
  }
  const WRAP = [THREE.ClampToEdgeWrapping, THREE.RepeatWrapping, THREE.MirroredRepeatWrapping];
  function build({ head, buf, base, texs }) {
    const [ox, oz] = head.origin;
    const verts = new Int16Array(buf, base + head.vertices);
    const meshes = [];
    for (const m of head.materials) {
      if (!m.count) continue;
      const pos = new Float32Array(m.count * 3), uv = new Float32Array(m.count * 2);
      const t = m.tex >= 0 ? texs[m.tex] : null;
      for (let i = 0; i < m.count; i++) {
        const v = (m.at + i) * 5;
        pos[i * 3] = verts[v] / 32 + ox; pos[i * 3 + 1] = verts[v + 1] / 32; pos[i * 3 + 2] = verts[v + 2] / 32 + oz;
        if (t) { uv[i * 2] = verts[v + 3] / 8 / t.w; uv[i * 2 + 1] = verts[v + 4] / 8 / t.h; }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      let mat;
      if (t) {
        const tx = new THREE.Texture(t.img);
        tx.flipY = false; tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.NearestFilter; tx.generateMipmaps = false;
        tx.wrapS = WRAP[m.wrap[0]]; tx.wrapT = WRAP[m.wrap[1]]; tx.needsUpdate = true;
        mat = new THREE.MeshBasicMaterial({ map: tx, side: THREE.DoubleSide, alphaTest: m.test ? 0.5 : 0,
          transparent: m.alpha < 31, opacity: m.alpha / 31, depthWrite: m.alpha >= 31 });
      } else {
        mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(m.color[0] / 255, m.color[1] / 255, m.color[2] / 255),
          side: THREE.DoubleSide, transparent: m.alpha < 31, opacity: m.alpha / 31 });
      }
      const mesh = new THREE.Mesh(g, mat);
      mesh.renderOrder = m.alpha < 31 ? 2 : 0;
      meshes.push(mesh);
    }
    return meshes;
  }
  function clear(group) {
    for (const o of [...group.children]) {
      group.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  }
  function heightAt(x, z) {
    ray.set(new THREE.Vector3(x, 200, z), new THREE.Vector3(0, -1, 0));
    const h = ray.intersectObjects(world.children, false);
    return h.length ? h[0].point.y : cam.ground;
  }
  function addEvents({ head, texs }) {
    const sq = (x, z, color, y) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, depthTest: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(x + 0.5, y + 0.03, z + 0.5); m.renderOrder = 5; return m;
    };
    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    for (const w of head.warps) { const m = sq(w.x, w.z, css('--warp'), cam.ground); m.userData.kind = 'warps'; marks.add(m); }
    for (const s of head.signs) { const m = sq(s.x, s.z, css('--sign'), cam.ground); m.userData.kind = 'signs'; marks.add(m); }
    for (const t of head.triggers) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(t.w, t.h), new THREE.MeshBasicMaterial({ color: css('--trigger'), transparent: true, opacity: 0.35, depthTest: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(t.x + t.w / 2, cam.ground + 0.04, t.z + t.h / 2); m.renderOrder = 5; m.userData.kind = 'trig'; marks.add(m);
    }
    for (const p of head.people) {
      let mat;
      if (p.tex >= 0) {
        const tx = new THREE.Texture(texs[p.tex].img); tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.NearestFilter;
        tx.generateMipmaps = false; tx.needsUpdate = true;
        mat = new THREE.SpriteMaterial({ map: tx, alphaTest: 0.5 });
      } else mat = new THREE.SpriteMaterial({ color: 0xff55aa, transparent: true, opacity: 0.6 });
      const s = new THREE.Sprite(mat);
      s.center.set(0.5, 0.06); if (p.tex >= 0) s.scale.set(2, 2, 1); else s.scale.set(0.6, 0.6, 1);   // (a person whose picture a script picks: a marker)
      s.position.set(p.x + 0.5, heightAt(p.x + 0.5, p.z + 0.5), p.z + 0.62);
      s.userData.person = p;
      people.add(s);
    }
    applyToggles();
  }
  function applyToggles() {
    people.visible = $('t-people').checked;
    for (const m of marks.children) m.visible = $('t-' + m.userData.kind).checked;
    if (grid) grid.visible = $('t-grid').checked;
  }
  for (const id of ['t-people', 't-warps', 't-signs', 't-trig', 't-grid']) $(id).addEventListener('change', applyToggles);

  async function open(entry) {
    current = entry; picked = null; sel.visible = false; $('picked').textContent = '';
    status.textContent = 'Loading ' + entry.title + '\u2026'; status.hidden = false;
    clear(world); clear(marks); clear(people);
    if (grid) { scene.remove(grid); grid = null; }
    $('r-map').textContent = entry.title;
    try {
      const files = entry.strips ? entry.strips.map((s) => s.file) : [entry.file];
      cam.ground = entry.world ? 1 : 0;      // (the overworld is built at HeartGold's ground, a square up)
      const parts = await Promise.all(files.map(loadBin));
      for (const part of parts) for (const m of build(part)) world.add(m);
      for (const part of parts) addEvents(part);
      const [sw, sh] = entry.strips ? [entry.strips[0].size[0], entry.strips.reduce((a, s) => a + s.size[1], 0)] : entry.size;
      const [gx, gz] = entry.strips ? entry.strips[0].origin : [0, 0];
      grid = new THREE.GridHelper(Math.max(sw, sh), Math.max(sw, sh), 0x3a4458, 0x3a4458);
      grid.position.set(gx + Math.max(sw, sh) / 2, cam.ground + 0.01, gz + Math.max(sw, sh) / 2);
      grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);
      applyToggles();
      // start where there is something to see: the overworld at Pallet, a room at its middle
      const box = new THREE.Box3();
      for (const m of world.children) { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); }
      if (entry.start) cam.target.set(entry.start[0] + 0.5, cam.ground, entry.start[1] + 0.5);
      else if (!box.isEmpty()) { const c = box.getCenter(new THREE.Vector3()); cam.target.set(c.x, cam.ground, c.z); }
      const span = box.isEmpty() ? 20 : Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
      cam.dist = entry.start ? 34 : Math.min(60, Math.max(10, span * 0.9));
      if (cam.mode === 'fly') setMode('game');
      placeCamera();
      status.hidden = true;
      try { history.replaceState(null, '', '#' + entry.name.replace(/_/g, '-')); } catch (e) {}
    } catch (err) {
      status.textContent = 'Could not load ' + entry.title + ': ' + err.message;
    }
  }

  // ---------------------------------------------------------------- the map list
  function fillList(q) {
    const sel_ = $('maps'); sel_.innerHTML = '';
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const groups = {};
    for (const e of LIST) {
      const hay = (e.title + ' ' + (e.map || '') + ' ' + e.group).toLowerCase();
      if (words.every((w) => hay.includes(w))) (groups[e.group] ||= []).push(e);
    }
    for (const [g, items] of Object.entries(groups)) {
      const og = document.createElement('optgroup'); og.label = g;
      for (const e of items.sort((a, b) => a.title.localeCompare(b.title))) {
        const o = document.createElement('option'); o.value = e.name; o.textContent = e.title;
        if (current && e.name === current.name) o.selected = true;
        og.appendChild(o);
      }
      sel_.appendChild(og);
    }
  }
  $('find').addEventListener('input', (e) => fillList(e.target.value));
  $('maps').addEventListener('change', (e) => { const m = LIST.find((x) => x.name === e.target.value); if (m) open(m); });
  $('fold').addEventListener('click', () => {
    const p = $('panel'); const closed = p.classList.toggle('closed');
    $('fold').textContent = closed ? 'Show' : 'Hide'; $('fold').setAttribute('aria-expanded', String(!closed));
  });
  window.addEventListener('hashchange', () => {
    const n = location.hash.slice(1).replace(/-/g, '_');
    const m = LIST.find((x) => x.name === n); if (m && m !== current) open(m);
  });

  fetch('maps.json').then((r) => r.json()).then((list) => {
    // (ours first, Kanto's overworld at the top; HeartGold's own maps to compare with at the end)
    const rank = (g) => g === 'Overworld' ? 0 : g.startsWith('HeartGold') ? 2 : 1;
    LIST = list.slice().sort((a, b) => rank(a.group) - rank(b.group) || a.group.localeCompare(b.group)); fillList('');
    const n = location.hash.slice(1).replace(/-/g, '_');
    open(LIST.find((x) => x.name === n) || LIST.find((x) => x.name === 'kanto') || LIST[0]);
  }).catch((err) => { status.textContent = 'Could not load the map list: ' + err.message; });
})();
</script>
